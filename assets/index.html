<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Полная блокировка прокрутки и скроллбаров */
        html, body { 
            margin: 0; padding: 0; background: #1e1e1e; color: #fff; 
            font-family: sans-serif; height: 100vh; width: 100vw;
            user-select: none; overflow: hidden; touch-action: none; 
            box-sizing: border-box; 
        }
        
        .bar { 
            display: flex; justify-content: space-between; padding: 4px 10px; 
            background: #1e1e1e; align-items: center; height: 45px; box-sizing: border-box; 
        }
        
        .btn { 
            background: #2d2d2d; color: #fff; border: 1px solid #444; 
            padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn:active { background: #444; }
        
        /* Экран виджетов растягивается строго на оставшуюся высоту */
        #widget-screen { 
            display: none; flex-direction: column; padding: 8px; background: #121212; 
            height: calc(100vh - 45px); box-sizing: border-box; overflow: hidden; 
        }
        
        .menu-row { display: flex; gap: 6px; height: 35px; align-items: center; margin-bottom: 6px; }
        
        /* Адаптивный контейнер под активный виджет */
        .widget-body { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; overflow: hidden; height: calc(100% - 41px); box-sizing: border-box;
        }
        
        #tab-clock { font-size: 8vh; font-weight: bold; color: #00ffcc; font-family: monospace; }
        
        /* Полностью адаптивный калькулятор без фиксированных размеров */
        .calc-container {
            display: flex; flex-direction: column; width: 100%; max-width: 320px; height: 100%; box-sizing: border-box;
        }
        
        #calc-display { 
            width: 100%; background: #000; color: #0f0; border: 1px solid #444; 
            padding: 8px; text-align: right; margin-bottom: 6px; font-family: monospace; 
            font-size: 18px; border-radius: 4px; box-sizing: border-box; height: 40px;
        }
        
        .calc-grid { 
            flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(5, 1fr); gap: 4px; width: 100%; box-sizing: border-box;
        }
        
        .calc-grid .btn { font-size: 16px; font-weight: bold; width: 100%; height: 100%; padding: 0; }
    </style>
</head>
<body>

    <div class="bar">
        <button class="btn" onclick="openPanel(true)">⚡ Виджеты / Панель</button>
        <span id="lang-indicator" style="font-size: 13px; color: #888; font-weight: bold;">RU</span>
    </div>

    <div id="widget-screen">
        <div class="menu-row">
            <button class="btn" onclick="switchTab('tab-clock')">🕒 Часы</button>
            <button class="btn" onclick="switchTab('tab-calc')">🧮 Калькулятор</button>
            <button class="btn" style="background: #a33; margin-left: auto;" onclick="openPanel(false)">✕ Свернуть</button>
        </div>

        <!-- ТАБ 1: ЧАСЫ -->
        <div id="tab-clock" class="widget-body">00:00:00</div>

        <!-- ТАБ 2: КАЛЬКУЛЯТОР -->
        <div id="tab-calc" class="widget-body" style="display: none;">
            <div class="calc-container">
                <input type="text" id="calc-display" readonly>
                <div class="calc-grid">
                    <button class="btn" onclick="press('C')">C</button><button class="btn" onclick="press('/')">/</button><button class="btn" onclick="press('*')">*</button><button class="btn" onclick="press('-')">-</button>
                    <button class="btn" onclick="press('7')">7</button><button class="btn" onclick="press('8')">8</button><button class="btn" onclick="press('9')">9</button><button class="btn" onclick="press('+')">+</button>
                    <button class="btn" onclick="press('4')">4</button><button class="btn" onclick="press('5')">5</button><button class="btn" onclick="press('6')">6</button>
                    <button class="btn" style="grid-row: span 2; background: #28a745;" onclick="insertResult()">📥</button>
                    <button class="btn" onclick="press('1')">1</button><button class="btn" onclick="press('2')">2</button><button class="btn" onclick="press('3')">3</button>
                    <button class="btn" style="grid-column: span 2;" onclick="press('0')">0</button><button class="btn" onclick="press('=')">=</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let expr = "";
        
        function openPanel(show) {
            document.getElementById('widget-screen').style.display = show ? 'flex' : 'none';
            if (window.AndroidKeyboard?.toggleWidgetView) window.AndroidKeyboard.toggleWidgetView(show);
        }
        
        function switchTab(tabId) {
            document.getElementById('tab-clock').style.display = 'none';
            document.getElementById('tab-calc').style.display = 'none';
            document.getElementById(tabId).style.display = 'flex';
        }
        
        function updateLangIndicator(lang) { 
            document.getElementById('lang-indicator').innerText = lang; 
        }
        
        // Часы с использованием относительных единиц высоты
        setInterval(() => {
            const now = new Date();
            document.getElementById('tab-clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // Логика калькулятора
        function press(val) {
            const out = document.getElementById('calc-display');
            if (val === 'C') expr = "";
            else if (val === '=') {
                try { expr = eval(expr.replace(/[^0-9+\-*/.]/g, '')).toString(); } catch(e) { expr = "Ошибка"; }
            } else { if (expr === "Ошибка") expr = ""; expr += val; }
            out.value = expr;
        }

        function insertResult() {
            const val = document.getElementById('calc-display').value;
            if (val && val !== "Ошибка" && window.AndroidKeyboard?.commitText) window.AndroidKeyboard.commitText(val);
        }
    </script>
</body>
</html>
