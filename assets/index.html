<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0; background: #1e1e1e; color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column;
            height: 100vh; user-select: none; box-sizing: border-box; overflow: hidden;
        }
        /* Компактная полоска виджетов */
        .bar {
            display: flex; justify-content: space-between; padding: 4px 8px; 
            background: #1e1e1e; align-items: center; height: 40px; box-sizing: border-box;
        }
        button {
            background: #2d2d2d; color: #fff; border: 1px solid #444; 
            padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;
        }
        button:active { background: #444; }

        /* Полноэкранный оверлей виджетов, когда служба разворачивает WebView */
        #widget-screen {
            display: none; flex: 1; flex-direction: column; padding: 10px; background: #121212;
        }
    </style>
</head>
<body>

    <!-- Эта полоска видна всегда НАД системными клавишами -->
    <div class="bar">
        <button onclick="openPanel(true)">⚡ Виджеты / Панель</button>
        <span style="font-size: 11px; color: #666;">СИСТЕМНЫЙ ВВОД</span>
    </div>

    <!-- Экран виджетов (Появляется при разворачивании) -->
    <div id="widget-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 6px;">
            <span style="font-size: 13px; font-weight: bold; color: #aaa;">Панель виджетов</span>
            <button style="background: #a33;" onclick="openPanel(false)">✕ Закрыть</button>
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
            <button onclick="sendText('Текст из веб-виджета!')">Вставить тестовый текст</button>
        </div>
    </div>

    <script>
        function openPanel(show) {
            document.getElementById('widget-screen').style.display = show ? 'flex' : 'none';
            // Даем команду Kotlin-службе изменить размер WebView
            if (window.AndroidKeyboard && window.AndroidKeyboard.toggleWidgetView) {
                window.AndroidKeyboard.toggleWidgetView(show);
            }
        }

        function sendText(text) {
            if (window.AndroidKeyboard && window.AndroidKeyboard.commitText) {
                window.AndroidKeyboard.commitText(text);
            }
        }
    </script>
</body>
</html>
