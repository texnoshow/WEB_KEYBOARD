<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
    <style>
        html, body { margin: 0; padding: 0; background: #1e1e1e; color: #fff; font-family: sans-serif; height: 100vh; width: 100vw; user-select: none; overflow: hidden; touch-action: none; box-sizing: border-box; }
        .bar { display: flex; padding: 4px 10px; background: #1e1e1e; align-items: center; height: 45px; box-sizing: border-box; gap: 8px; }
        .btn { background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn:active { background: #444; }
        .btn.active { background: #444444; border-color: #00ffcc; color: #00ffcc; }
        
        #widget-screen { display: none; flex-direction: column; padding: 4px; background: #121212; height: calc(100vh - 45px); box-sizing: border-box; overflow: hidden; }
        .menu-row { display: flex; gap: 4px; margin-bottom: 4px; height: 32px; align-items: center; }
        .widget-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; width: 100%; height: calc(100% - 36px); }
        
        /* Стили элементов встроенного браузера */
        .browser-search { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; height: 26px; box-sizing: border-box; }
        .browser-frame { width: 100%; flex: 1; border: 1px solid #333; border-radius: 6px; background: #fff; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="bar">
        <button class="btn" id="btn-widgets" onclick="openPanel(true)">⚡ Виджеты</button>
        <button class="btn" id="btn-symbols" onclick="pressSymbols()">🔢 Цифры</button>
        <span id="lang-indicator" style="font-size: 13px; color: #888; font-weight: bold; margin-left: auto; padding-right: 4px;">RU</span>
    </div>

    <div id="widget-screen">
        <div class="menu-row">
            <button class="btn" onclick="switchTab('tab-clock')">🕒 Время</button>
            <button class="btn" onclick="switchTab('tab-browser')">🌐 Браузер</button>
            <button class="btn" style="background: #a33; margin-left: auto;" onclick="openPanel(false)">✕</button>
        </div>

        <!-- ТАБ 1: ЧАСЫ -->
        <div id="tab-clock" class="widget-body">
            <div id="clock" style="font-size: 8vh; font-weight: bold; color: #00ffcc; font-family: monospace;">00:00:00</div>
        </div>

        <!-- ТАБ 2: МИНИ-БРАУЗЕР -->
        <div id="tab-browser" class="widget-body" style="display: none;">
            <!-- Панель управления браузером -->
            <div class="menu-row" style="width: 100%; margin-bottom: 4px; padding: 0 2px;">
                <input type="text" id="search-input" class="browser-search" placeholder="Введите URL или запрос..." value="https://start.duckduckgo.com">
                <button class="btn" style="padding: 4px 8px;" onclick="browseGo()">Перейти</button>
                <button class="btn" style="padding: 4px 8px; background: #333;" onclick="browseRefresh()">🔄</button>
            </div>
            <!-- Окно отображения сайтов -->
            <iframe id="browser-viewport" class="browser-frame" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        let isSymbolMode = false;

        function openPanel(show) {
            if (show && isSymbolMode) pressSymbols();
            document.getElementById('widget-screen').style.display = show ? 'flex' : 'none';
            if (window.AndroidKeyboard?.toggleWidgetView) window.AndroidKeyboard.toggleWidgetView(show);
        }

        function switchTab(tabId) {
            document.getElementById('tab-clock').style.display = 'none';
            document.getElementById('tab-browser').style.display = 'none';
            document.getElementById(tabId).style.display = 'flex';
            
            // Если открываем браузер первый раз, загружаем стартовую страницу
            if (tabId === 'tab-browser') {
                const frame = document.getElementById('browser-viewport');
                if (frame.src === "about:blank" || frame.src === "") {
                    browseGo();
                }
            }
        }

        function updateLangIndicator(lang) { document.getElementById('lang-indicator').innerText = lang; }

        function pressSymbols() {
            isSymbolMode = !isSymbolMode;
            document.getElementById('btn-symbols').classList.toggle('active', isSymbolMode);
            if (window.AndroidKeyboard?.toggleSymbolMode) window.AndroidKeyboard.toggleSymbolMode(isSymbolMode);
        }

        function updateSymbolButtonState(active) {
            isSymbolMode = active;
            document.getElementById('btn-symbols').classList.toggle('active', isSymbolMode);
        }
        
        // 🕒 ЧАСЫ
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        // 🌐 ЛОГИКА МИНИ-БРАУЗЕРА
        function browseGo() {
            const input = document.getElementById('search-input').value.trim();
            const frame = document.getElementById('browser-viewport');
            
            if (input === "") return;
            
            // Если ввели не ссылку, а поисковый запрос, перенаправляем в Яндекс
            if (!input.startsWith('http://') && !input.startsWith('https://') && input.includes('.')) {
                frame.src = 'https://' + input;
            } else if (input.startsWith('http://') || input.startsWith('https://')) {
                frame.src = input;
            } else {
                // Превращаем текст в поисковый запрос (например, через поиск Яндекса)
                frame.src = 'https://yandex.ru' + encodeURIComponent(input);
            }
        }

        function browseRefresh() {
            const frame = document.getElementById('browser-viewport');
            // Перезагружаем текущую страницу в iframe
            frame.src = frame.src;
        }
    </script>
</body>
</html>
