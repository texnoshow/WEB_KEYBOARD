<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0; background: #121212; color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column; height: 250px;
            user-select: none; overflow: hidden; box-sizing: border-box;
        }
        /* Верхняя панель */
        .keyboard-bar {
            display: flex; justify-content: space-between; padding: 6px 10px; 
            background: #1e1e1e; border-top: 1px solid #333; align-items: center; height: 35px;
        }
        .bar-btn {
            background: #2d2d2d; color: #fff; border: 1px solid #444; 
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .bar-btn:active { background: #444; }

        /* Контейнер для рядов клавиш */
        #keyboard-view {
            flex: 1; display: flex; flex-direction: column; 
            padding: 4px; gap: 4px; background: #121212;
        }
        .keyboard-row {
            display: flex; flex: 1; gap: 4px; justify-content: center; width: 100%;
        }
        /* Стили для кнопок-букв */
        .keyboard-row button {
            flex: 1; background: #2d2d2d; color: #fff; border: none;
            border-bottom: 2px solid #1a1a1a; border-radius: 4px;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .keyboard-row button:active { background: #444; }
        
        /* Стили для системных кнопок (Shift, Backspace, Enter, Глобус) */
        .keyboard-row button.system-key {
            background: #1e1e1e; font-size: 14px;
        }
        .keyboard-row button.space-key {
            flex: 4; /* Пробел делаем широким */
        }

        /* Оверлей панели виджетов */
        #overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.95); flex-direction: column; padding: 12px; box-sizing: border-box;
            z-index: 100;
        }
        .content-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 14px; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Интерфейс клавиатуры -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
        <div class="keyboard-bar">
            <button class="bar-btn" onclick="toggleOverlay(true)">⚡ Виджеты / Панель</button>
            <span id="lang-indicator" style="font-size: 12px; color: #888; font-weight: bold;">RU</span>
        </div>
        
        <!-- Сюда наш скрипт сам добавит локальные кнопки -->
        <div id="keyboard-view"></div>
    </div>

    <!-- Заглушка панели виджетов -->
    <div id="overlay">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px;">
            <span style="font-size: 13px; font-weight: bold; color: #aaa;">Панель виджетов</span>
            <button class="bar-btn" onclick="toggleOverlay(false)">✕ Закрыть</button>
        </div>
        <div class="content-area">
            <button class="bar-btn" onclick="sendPayload('Привет из скрипта!')">Вставить тестовый текст</button>
        </div>
    </div>

    <script>
        // Полностью автономные локальные раскладки
        const LANGUAGES = {
            ru: {
                normal: [
                    ["й", "ц", "у", "к", "е", "н", "г", "ш", "щ", "з", "х", "ъ"],
                    ["ф", "ы", "в", "а", "п", "р", "о", "л", "д", "ж", "э"],
                    ["⇧", "я", "ч", "с", "м", "и", "т", "ь", "б", "ю", "⌫"],
                    ["🌐", "Пробел", "Enter"]
                ],
                shift: [
                    ["Й", "Ц", "У", "К", "Е", "Н", "Г", "Ш", "Щ", "З", "Х", "Ъ"],
                    ["Ф", "Ы", "В", "А", "П", "Р", "О", "Л", "Д", "Ж", "Э"],
                    ["⇧", "Я", "Ч", "С", "М", "И", "Т", "Ь", "Б", "Ю", "⌫"],
                    ["🌐", "Пробел", "Enter"]
                ]
            },
            en: {
                normal: [
                    ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"],
                    ["a", "s", "d", "f", "g", "h", "j", "k", "l"],
                    ["⇧", "z", "x", "c", "v", "b", "n", "m", "⌫"],
                    ["🌐", "Пробел", "Enter"]
                ],
                shift: [
                    ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
                    ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
                    ["⇧", "Z", "X", "C", "V", "B", "N", "M", "⌫"],
                    ["🌐", "Пробел", "Enter"]
                ]
            }
        };

        let currentLang = 'ru';
        let isShift = false;

        // Автоматический локальный движок генерации клавиш
        function renderKeyboard() {
            const container = document.getElementById('keyboard-view');
            container.innerHTML = ''; // Очищаем старые кнопки

            const layout = isShift ? LANGUAGES[currentLang].shift : LANGUAGES[currentLang].normal;

            layout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';

                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.innerText = key;
                    
                    // Настройка типов кнопок для стилей
                    if (["⇧", "⌫", "Enter", "🌐"].includes(key)) {
                        btn.classList.add('system-key');
                    } else if (key === "Пробел") {
                        btn.classList.add('space-key');
                    }

                    // Логика нажатий
                    btn.onclick = (e) => {
                        e.preventDefault();
                        
                        if (key === "⌫") {
                            if (window.AndroidKeyboard) AndroidKeyboard.sendBackspace();
                        } else if (key === "Enter") {
                            if (window.AndroidKeyboard) AndroidKeyboard.sendKeyDownUp(66);
                        } else if (key === "Пробел") {
                            if (window.AndroidKeyboard) AndroidKeyboard.commitText(" ");
                        } else if (key === "⇧") {
                            isShift = !isShift;
                            renderKeyboard();
                        } else if (key === "🌐") {
                            currentLang = currentLang === 'ru' ? 'en' : 'ru';
                            document.getElementById('lang-indicator').innerText = currentLang.toUpperCase();
                            renderKeyboard();
                        } else {
                            // Печать обычной буквы через Kotlin
                            if (window.AndroidKeyboard) AndroidKeyboard.commitText(key);
                            
                            // Сброс временного Shift
                            if (isShift) {
                                isShift = false;
                                renderKeyboard();
                            }
                        }
                    };

                    rowDiv.appendChild(btn);
                });
                container.appendChild(rowDiv);
            });
        }

        function toggleOverlay(show) {
            document.getElementById('overlay').style.display = show ? 'flex' : 'none';
        }

        function sendPayload(text) {
            if (window.AndroidKeyboard) {
                AndroidKeyboard.commitText(text);
            }
        }

        // Запуск генерации при старте страницы
        window.onload = renderKeyboard;
    </script>
</body>
</html>
