<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        html, body { margin: 0; padding: 0; background: #1e1e1e; color: #fff; font-family: sans-serif; height: 100vh; width: 100vw; user-select: none; overflow: hidden; touch-action: none; box-sizing: border-box; }
        .bar { display: flex; padding: 4px 10px; background: #1e1e1e; align-items: center; height: 45px; box-sizing: border-box; gap: 8px; }
        .btn { background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn:active { background: #444; }
        .btn.active { background: #444444; border-color: #00ffcc; color: #00ffcc; }
        #widget-screen { display: none; flex-direction: column; padding: 12px; background: #121212; height: calc(100vh - 45px); box-sizing: border-box; overflow: hidden; }
        .menu-row { display: flex; gap: 6px; margin-bottom: 10px; }
        .widget-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    </style>
</head>
<body>

    <div class="bar">
        <button class="btn" id="btn-widgets" onclick="openPanel(true)">⚡ Виджеты</button>
        <button class="btn" id="btn-symbols" onclick="pressSymbols()">🔢 Цифры</button>
        <span id="lang-indicator" style="font-size: 13px; color: #888; font-weight: bold; margin-left: auto; padding-right: 4px;">RU</span>
    </div>

    <div id="widget-screen">
        <div class="menu-row">
            <button class="btn" onclick="switchTab('tab-clock')">🕒 Часы</button>
            <button class="btn" style="background: #a33; margin-left: auto;" onclick="openPanel(false)">✕ Свернуть</button>
        </div>

        <div id="tab-clock" class="widget-body">
            <div id="clock" style="font-size: 8vh; font-weight: bold; color: #00ffcc; font-family: monospace;">00:00:00</div>
        </div>
    </div>

    <script>
        let isSymbolMode = false;

        function openPanel(show) {
            if (show && isSymbolMode) pressSymbols();
            document.getElementById('widget-screen').style.display = show ? 'flex' : 'none';
            if (window.AndroidKeyboard?.toggleWidgetView) window.AndroidKeyboard.toggleWidgetView(show);
        }

        function updateLangIndicator(lang) { 
            document.getElementById('lang-indicator').innerText = lang; 
        }

        function pressSymbols() {
            isSymbolMode = !isSymbolMode;
            const btn = document.getElementById('btn-symbols');
            if (isSymbolMode) btn.classList.add('active');
            else btn.classList.remove('active');
            
            if (window.AndroidKeyboard?.toggleSymbolMode) {
                window.AndroidKeyboard.toggleSymbolMode(isSymbolMode);
            }
        }

        function updateSymbolButtonState(active) {
            isSymbolMode = active;
            const btn = document.getElementById('btn-symbols');
            if (isSymbolMode) btn.classList.add('active');
            else btn.classList.remove('active');
        }
        
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ');
        }, 1000);
    </script>
</body>
</html>
