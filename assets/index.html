<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0; background: #121212; color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column; height: 250px;
            user-select: none;
        }
        .keyboard-bar {
            display: flex; padding: 8px; background: #1e1e1e; border-top: 1px solid #333;
        }
        button {
            background: #2d2d2d; color: #fff; border: 1px solid #444; 
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        button:active { background: #444; }

        #overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); flex-direction: column; padding: 12px; box-sizing: border-box;
            z-index: 100;
        }
        .content-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 14px; text-align: center;
        }
    </style>
</head>
<body>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="padding: 10px; color: #555; text-align: center;">[ Обычная зона клавиатуры ]</div>
        <div class="keyboard-bar">
            <button onclick="toggleOverlay(true)">⚡ Виджеты / Панель</button>
        </div>
    </div>

    <div id="overlay">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px;">
            <span style="font-size: 13px; font-weight: bold; color: #aaa;">Кастомная панель</span>
            <button onclick="toggleOverlay(false)">✕ Закрыть</button>
        </div>
        
        <div class="content-area">
            <button onclick="sendPayload('Привет из скрипта!')">Вставить тестовый текст</button>
        </div>
    </div>

    <script>
        function toggleOverlay(show) {
            document.getElementById('overlay').style.display = show ? 'flex' : 'none';
        }

        function sendPayload(text) {
            if (window.AndroidKeyboard) {
                AndroidKeyboard.commitText(text);
            }
        }
    </script>
</body>
</html>
