name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Создаем минимальный build.gradle на лету, если его еще нет
    - name: Create Gradle build file
      run: |
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.0' apply false
        }
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "HtmlKeyboard"
        include ':app'
        EOF

        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.htmlkeyboard'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.htmlkeyboard"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # Переносим существующие файлы по правильным путям Android-проекта
        mkdir -p app/src/main/java/com/example/htmlkeyboard
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/assets
        
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f res/xml/method.xml ] && mv res/xml/method.xml app/src/main/res/xml/
        [ -f assets/index.html ] && mv assets/index.html app/src/main/assets/
        [ -f src/com/example/htmlkeyboard/MyKeyboardService.kt ] && mv src/com/example/htmlkeyboard/MyKeyboardService.kt app/src/main/java/com/example/htmlkeyboard/
        
        # Создаем gradle wrapper
        gradle wrapper
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: html-keyboard-apk
        path: app/build/outputs/apk/debug/app-debug.apk
