name: Build Android APK

on:
  push:
    paths-ignore:
      - '.github/workflows/**'  # Защита: сохранение этого файла не запустит сборку заново
  workflow_dispatch:            # Позволяет запустить сборку вручную кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files & Gradle Wrapper
      run: |
        # 1. Создаем settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "HtmlKeyboard"
        include ':app'
        EOF

        # 2. Создаем корневой build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 3. Создаем файл gradle.properties и включаем поддержку AndroidX
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF

        # 4. Создаем папку модуля app и настраиваем ее build.gradle
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.htmlkeyboard'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.htmlkeyboard"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
            
            // Явно выравниваем версии Java до 1.8 для обоих компиляторов
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = "1.8"
            }
            
            sourceSets {
                main {
                    manifest.srcFile '../AndroidManifest.xml'
                    java.srcDirs = ['../src']
                    res.srcDirs = ['../res']
                    assets.srcDirs = ['../assets']
                }
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
        }
        EOF
        
        # Генерируем локальный Gradle Wrapper 8.5
        gradle wrapper --gradle-version 8.5

    # АВТО-ИСПРАВЛЕНИЕ: Скрипт сам заменяет плохую ссылку на корректную внутри XML-файла клавиатуры
    - name: Fix XML Namespace Typo
      run: |
        sed -i 's|http://android.com|http://android.com|g' res/xml/method.xml

    # Собираем чистый релизный APK с исправленным XML-файлом
    - name: Build Release APK
      run: ./gradlew clean assembleRelease

    # Автоматически создаем ключ подписи и кодируем его для шага подписи
    - name: Generate Auto Signing Key
      id: create_key
      run: |
        keytool -genkey -v -keystore auto-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key_alias -storepass my_password -keypass my_password -dname "CN=HtmlKeyboard, OU=Dev, O=OSS, L=City, S=State, C=US"
        KEY_B64=$(base64 -w 0 auto-release.jks)
        echo "signing_key_b64=$KEY_B64" >> $GITHUB_OUTPUT

    # ИСПРАВЛЕНО: Переменная BUILD_TOOLS_VERSION теперь передается строго в блок env
    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ steps.create_key.outputs.signing_key_b64 }}
        alias: key_alias
        keyStorePassword: my_password
        keyPassword: my_password

    # Выгружаем полностью готовую, подписанную и корректно работающую клавиатуру
    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: html-keyboard-release-signed
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
