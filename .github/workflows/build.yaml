name: Build Android APK

on:
  push:
    paths-ignore:
      - '.github/workflows/**'  # Защита: сохранение этого файла не запустит сборку заново
  workflow_dispatch:            # Позволяет запустить сборку вручную кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files & Gradle Wrapper
      run: |
        # 1. Создаем settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "HtmlKeyboard"
        include ':app'
        EOF

        # 2. Создаем корневой build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 3. Создаем файл gradle.properties и включаем поддержку AndroidX
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF

        # 4. Создаем папку модуля app и настраиваем ее build.gradle
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.htmlkeyboard'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.htmlkeyboard"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            
            // Явно выравниваем версии Java до 1.8 для обоих компиляторов
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = "1.8"
            }
            
            sourceSets {
                main {
                    manifest.srcFile '../AndroidManifest.xml'
                    java.srcDirs = ['../src']
                    res.srcDirs = ['../res']
                    assets.srcDirs = ['../assets']
                }
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
        }
        EOF
        
        # Генерируем локальный Gradle Wrapper 8.5
        gradle wrapper --gradle-version 8.5
    
    - name: Build Debug APK
      # ИСПРАВЛЕНО: Добавлена команда clean для принудительного сброса кэша перед сборкой
      run: ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: html-keyboard-apk
        path: app/build/outputs/apk/debug/app-debug.apk
